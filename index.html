<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李文彤 | 個人品牌與簡介</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sunshine: '#FF9F43',
                        coral: '#FF5252',
                        amberGlow: '#FFBE21',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAFAF9;
            color: #1C1917;
        }

        /* 亮麗光暈背景裝飾 */
        .glow-bg {
            background: radial-gradient(circle at 50% 20%, rgba(255, 159, 67, 0.25) 0%, rgba(255, 82, 82, 0.1) 45%, rgba(255, 255, 255, 0) 70%);
        }

        /* 亮麗卡片 */
        .vibrant-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(254, 215, 170, 0.6);
            box-shadow: 0 12px 32px -8px rgba(255, 120, 48, 0.12);
        }

        /* Toast 彈窗動畫 */
        #toast {
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(120%) scale(0.9);
            opacity: 0;
        }
        #toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-orange-200 selection:text-orange-900">

    <!-- Ambient Vivid Background Light -->
    <div class="fixed inset-0 glow-bg pointer-events-none -z-10"></div>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-6 py-10 sm:py-16 w-full flex-grow flex flex-col justify-center">

        <!-- 1. HERO PROFILE CARD (簡潔強烈的主區塊) -->
        <div class="vibrant-card rounded-3xl p-8 sm:p-10 mb-6 text-center relative overflow-hidden">
            <!-- Top Gradient Accent -->
            <div class="absolute top-0 inset-x-0 h-2.5 bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500"></div>

            <!-- DEDICATED PERSONAL AVATAR SPOT (唯一的個人照片位置) -->
            <div class="relative w-36 h-36 sm:w-44 sm:h-44 mx-auto mb-6 group cursor-pointer" onclick="triggerPhotoChange()">
                <div class="absolute -inset-2 bg-gradient-to-tr from-amber-400 via-orange-500 to-rose-500 rounded-full blur-md opacity-80 group-hover:opacity-100 transition duration-300"></div>
                <div class="relative w-full h-full rounded-full overflow-hidden border-4 border-white shadow-xl bg-orange-50">
                    <img id="user-avatar" 
                         src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=600&auto=format&fit=crop" 
                         alt="李文彤的個人照片" 
                         class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    
                    <!-- Quick Hover Overlay Hint -->
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition duration-300 flex flex-col items-center justify-center text-white text-xs font-bold gap-1">
                        <i class="fa-solid fa-camera text-base"></i>
                        <span>點擊替換照片</span>
                    </div>
                </div>
                <!-- Status Badge -->
                <span class="absolute bottom-1 right-1 w-7 h-7 bg-white rounded-full p-1 shadow-md border border-orange-100 flex items-center justify-center text-amber-500 font-black text-xs" title="個人照片">
                    <i class="fa-solid fa-sparkles"></i>
                </span>
            </div>

            <!-- Hidden File Input for Avatar Upload Simulation -->
            <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="previewUploadedPhoto(event)">

            <!-- Name and Title -->
            <h1 class="text-4xl sm:text-5xl font-black tracking-tight text-gray-900 mb-2">
                李文彤
            </h1>
            <p class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-gradient-to-r from-orange-100 to-amber-100 text-orange-900 font-bold text-xs sm:text-sm mb-6 border border-orange-200/60">
                <i class="fa-solid fa-graduation-cap text-orange-500"></i>
                黎明技術學院 數位多媒體系
            </p>

            <!-- One-Line Bio Quote -->
            <div class="bg-gradient-to-br from-amber-50 to-orange-50 p-4 sm:p-5 rounded-2xl border border-orange-100 text-stone-800 text-sm sm:text-base font-semibold leading-relaxed">
                「 總而言之，我喜歡簡單、平靜的生活，也熱愛旅行。」
            </div>
        </div>

        <!-- 2. SKILLS & INTERESTS (精簡亮麗標籤卡) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            
            <!-- Professional Skill Pill -->
            <div class="vibrant-card rounded-2xl p-6 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-orange-500 to-amber-500 text-white flex items-center justify-center text-xl font-bold shadow-md shadow-orange-500/20 shrink-0">
                    <i class="fa-solid fa-camera-retro"></i>
                </div>
                <div>
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-orange-600">專長技能</span>
                    <h3 class="text-lg font-black text-gray-900 mt-0.5">攝影與傳播</h3>
                </div>
            </div>

            <!-- Personal Interests Pill -->
            <div class="vibrant-card rounded-2xl p-6 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-rose-500 to-orange-400 text-white flex items-center justify-center text-xl font-bold shadow-md shadow-rose-500/20 shrink-0">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div>
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-rose-600">個人興趣</span>
                    <h3 class="text-lg font-black text-gray-900 mt-0.5 flex items-center gap-2">
                        <span>聽音樂</span>
                        <span class="text-gray-300">‧</span>
                        <span>睡覺</span>
                    </h3>
                </div>
            </div>

        </div>

        <!-- 3. CONTACT DIRECTORY (一鍵互動聯絡) -->
        <div class="vibrant-card rounded-3xl p-6 sm:p-8">
            <h2 class="text-xs font-black uppercase tracking-widest text-center text-stone-400 mb-5">
                Quick Contact ‧ 聯繫方式
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                
                <!-- Email Button -->
                <button onclick="copyInfo('bd1151012@mail.lit.edu.tw.tw', 'Email')" 
                        class="group p-3.5 rounded-2xl bg-amber-50/80 hover:bg-amber-100/80 border border-amber-200/80 text-amber-950 font-bold text-xs flex flex-col items-center justify-center gap-1.5 transition active:scale-95">
                    <i class="fa-solid fa-envelope text-lg text-amber-600 group-hover:scale-110 transition"></i>
                    <span>複製 Email</span>
                </button>

                <!-- Line ID Button -->
                <button onclick="copyInfo('@muay_nannaphat', 'Line ID')" 
                        class="group p-3.5 rounded-2xl bg-emerald-50/80 hover:bg-emerald-100/80 border border-emerald-200/80 text-emerald-950 font-bold text-xs flex flex-col items-center justify-center gap-1.5 transition active:scale-95">
                    <i class="fa-brands fa-line text-lg text-emerald-600 group-hover:scale-110 transition"></i>
                    <span>複製 Line ID</span>
                </button>

                <!-- Instagram Button -->
                <a href="https://instagram.com/bl4qur_" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="group p-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-amber-500 text-white font-bold text-xs flex flex-col items-center justify-center gap-1.5 shadow-md shadow-rose-500/20 hover:opacity-95 transition active:scale-95">
                    <i class="fa-brands fa-instagram text-lg group-hover:scale-110 transition"></i>
                    <span>造訪 Instagram</span>
                </a>

            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="py-6 text-center text-xs text-stone-400 font-semibold">
        &copy; <span id="year"></span> 李文彤 (Li Wen-Tong) ‧ 黎明技術學院數位多媒體系
    </footer>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white text-xs font-bold py-3 px-6 rounded-full shadow-2xl flex items-center gap-2 border border-stone-800">
        <i class="fa-solid fa-circle-check text-amber-400 text-sm"></i>
        <span id="toast-text">已複製！</span>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // 複製到剪貼簿功能
        function copyInfo(text, label) {
            const temp = document.createElement('input');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            try {
                document.execCommand('copy');
                showToast(`已成功複製 ${label}：${text}`);
            } catch (err) {
                showToast('複製失敗，請手動複製');
            }
            document.body.removeChild(temp);
        }

        // 提示彈窗機制
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2600);
        }

        // 觸發替換個人照片
        function triggerPhotoChange() {
            document.getElementById('photo-input').click();
        }

        // 預覽上傳的照片
        function previewUploadedPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('user-avatar').src = e.target.result;
                    showToast('已成功更新您的個人照片！');
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
